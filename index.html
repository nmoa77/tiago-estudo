/* Missão Tiago — interface clara, navegação móvel melhorada */
:root{color-scheme:light;--bg:#f8f9fb;--panel:#fff;--panel2:#fff5f5;--stroke:#e5e7eb;--muted:#64748b;--txt:#172033;--accent:#cc2635;--blue:#2563eb;--orange:#a95813;--red:#c52333;--radius:17px}
html,body{background:#f8f9fb!important;color:#172033!important}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{padding-bottom:125px!important}
header{color:#172033}
.card{background:#fff!important;color:#172033!important;border:1px solid #e7e9ef!important;box-shadow:0 7px 24px rgba(20,30,48,.045)!important}
.hero{background:linear-gradient(135deg,#fff1f2,#fff 80%)!important;border:1px solid #ffd4d8!important}
.hero p,p{color:#4b5563}
small,.muted{color:#64748b!important}
h1,h2,h3,b,strong{color:#172033}
.pill{background:#ffe7ea!important;color:#b91c2b!important}
button,.btn{background:#c92737;color:white}
button.secondary,.btn.secondary{background:#f1f3f6;color:#273449}
button.danger,.btn.danger{background:#991b1b;color:white}
input,select,textarea{background:#fff!important;color:#172033!important;border:1px solid #cbd5e1!important}
input[type=checkbox]{accent-color:#d32c3c}
.metric{background:#fff7f7!important;border:1px solid #ffe3e5}
.metric strong{color:#b91c2b}
.progress{background:#e8eaf0}
.progress>span{background:#d32c3c!important}
.item,.entry{border-color:#edf0f3!important}
.tag{background:#f1f3f6;color:#475569}
.tag.urgent{background:#ffe4e6;color:#b91c2b}
.tag.done{background:#e8f7ef;color:#047857}
.empty{background:#fafbfc!important;color:#64748b!important;border-color:#d5dae2!important}
.note,.fine{color:#64748b}
.days button,.daychip{background:#fff!important;color:#334155!important;border:1px solid #e2e8f0}
.days button.active,.daychip.active{background:#ffe7ea!important;color:#ac1e2e!important;border-color:#f5adb7}
.schedule-time,.schedule-room,.entry-sub{color:#64748b!important}
.notice{background:#fff7ed!important;color:#9a3412!important}
.nav{position:fixed!important;bottom:max(12px,env(safe-area-inset-bottom))!important;left:12px!important;right:12px!important;z-index:30!important;background:rgba(255,255,255,.98)!important;border:1px solid #e5e7eb!important;border-radius:19px!important;box-shadow:0 12px 38px rgba(15,23,42,.14)!important;padding:7px!important;backdrop-filter:blur(15px)}
.nav-inner{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:3px!important;width:100%;max-width:710px;margin:0 auto}
.nav button{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:3px!important;min-height:55px!important;padding:7px 2px!important;border-radius:12px!important;background:transparent!important;color:#475569!important;font-size:11px!important;line-height:1.15!important;font-weight:600!important;min-width:0!important;box-shadow:none!important}
.nav button span{font-size:20px!important;line-height:1!important}
.nav button.active{background:#fff0f1!important;color:#ba2333!important;font-weight:800!important}
.nav button:focus-visible,button:focus-visible{outline:3px solid #f7a6ad;outline-offset:2px}
.brand-icon{background:#c92737!important;color:white!important}
.eyebrow{color:#c92737!important}
.quote{background:#fff3f4!important;border-left:3px solid #c92737!important;color:#334155!important}
.task{background:#fff!important;border-color:#e8e9ee!important}
.task .meta,.task .subnote{color:#64748b!important}
.task.done .title{color:#6b7280!important}
.tabs-inline button{background:#fff!important;color:#475569!important;border-color:#e2e8f0!important}
.tabs-inline button.selected{background:#fff0f1!important;color:#ba2333!important;border-color:#f5adb7!important}
.iconbutton{background:#f2f3f6!important;color:#334155!important}
.focus-time{color:#ba2333!important}
@media(min-width:750px){.nav{left:50%!important;right:auto!important;transform:translateX(-50%)!important;width:min(710px,calc(100% - 24px))!important}}

/* Interface tipo jogo de futebol — clara, acessível e sem excessos */
body{background:linear-gradient(180deg,#f5f6fa,#fff 300px)!important}
main{max-width:760px!important}
.game-heading{display:block!important;margin:14px 0 18px!important}
.game-heading h1{font-size:clamp(30px,5vw,44px)!important;font-weight:900!important;letter-spacing:-.045em!important;line-height:1.08!important}
.game-heading p{margin:5px 0 0!important;font-size:14px!important}
.game-overline{display:block;color:#ae1829!important;font-weight:850!important;font-size:11px!important;letter-spacing:.12em!important}
.player-card{border-radius:20px;background:linear-gradient(135deg,#8e1423,#d12431 66%,#eb4550);padding:19px;color:#fff;position:relative;overflow:hidden;box-shadow:0 9px 20px rgba(130,20,30,.16);margin:14px 0}
.player-card:before{content:"";position:absolute;width:180px;height:180px;right:-70px;top:-105px;border:25px solid #ffffff12;border-radius:50%}
.player-card *{position:relative}
.player-card h2,.player-card b,.player-card strong,.player-card .game-overline{color:#fff!important}
.player-card .game-overline{opacity:.75!important}
.player-card p{color:#ffe5e5!important}
.player-profile{display:flex;gap:15px;align-items:center}
.player-avatar{border:2px solid #fff8;width:67px;height:75px;border-radius:13px;background:linear-gradient(145deg,#fff,#ededee);color:#c31a2c;display:flex;justify-content:center;align-items:center;font-weight:950;font-size:43px;position:relative;box-shadow:0 6px 18px #0002}
.player-avatar span{position:absolute;right:4px;bottom:3px;font-size:10px;background:#b91c2b;color:white;padding:2px 4px;border-radius:3px}
.player-profile h2{font-size:30px;margin:1px 0!important;letter-spacing:.035em}
.player-rank{font-size:13px;color:#ffe4e6;font-weight:750}
.level-track{height:10px;border-radius:30px;background:#ffffff4d;margin-top:14px;overflow:hidden}
.level-track span{display:block;height:100%;background:#fff;min-width:2px}
.player-summary{display:flex;justify-content:space-between;gap:10px;margin-top:11px;font-size:12px;font-weight:750}
.game-counter{color:#ad1b2c;font-weight:900;font-size:13px;background:#fff1f2;border-radius:30px;padding:6px 10px}
.game-hero{border-left:5px solid #d71920!important}
.game-hero h2{border:0!important;padding:0!important;font-size:24px}
.mission-grid{display:grid;gap:10px;margin:14px 0}
.mission-card{display:flex!important;align-items:center!important;gap:12px;padding:14px;border:1px solid #e4e6ed;background:#fdfdfd;border-radius:13px;cursor:pointer;font-size:14px;color:#1a2433!important}
.mission-card.mission-done{background:#f1fbf6;border-color:#a7e4c2}
.mission-card input{width:21px!important;height:21px!important;margin:0!important;flex:0 0 auto}
.mission-number{background:#fce7e9;color:#ae1e2e;border-radius:9px;padding:6px 8px;font-size:13px;font-weight:900}
.mission-card .grow{flex:1;min-width:0}
.mission-card b{display:block!important;color:#172033!important}
.mission-card small{display:block!important;color:#5e6978!important;font-size:12px!important;margin-top:2px}
.game-list-item{display:flex;gap:9px;align-items:center;border-bottom:1px solid #edf0f4;padding:14px 0;flex-wrap:wrap}
.game-list-item:last-child{border-bottom:0}
.game-list-item .grow{flex:1;min-width:120px}
.game-list-item b,.game-list-item small{display:block}
.game-list-item b{font-size:14px}
.game-list-item small{font-size:12px;margin-top:3px}
.game-list-item.completed b{text-decoration:line-through;color:#64748b!important}
.game-list-item input[type=checkbox]{width:20px;height:20px;accent-color:#b91c2b}
.game-dot{width:31px;height:31px;display:grid;place-items:center;border-radius:9px;background:#fff0f1;color:#b91c2b;font-weight:900}
.game-details{padding:0!important;overflow:hidden}
.game-details summary{padding:19px;cursor:pointer;list-style:none;font-weight:850;font-size:16px;display:flex;justify-content:space-between;gap:10px}
.game-details summary::-webkit-details-marker{display:none}
.game-details summary:after{content:"⌄";font-size:21px;color:#b91c2b}
.game-details[open] summary:after{content:"⌃"}
.game-details>form,.game-details>p,.game-details>.line,.game-details>h3,.game-details>.game-list-item,.game-details>.actions,.game-details>input{margin-left:18px;margin-right:18px}
.game-details>form{margin-bottom:18px}
.game-details>.actions{margin-bottom:16px}
.game-details>p:last-child{padding-bottom:15px}
.game-tip{margin-top:13px;padding:13px;background:#fff6f6;border-left:3px solid #d71920;border-radius:9px}
.game-tip p{margin:4px 0 0}
.match-day{font-size:19px;margin-top:20px}
.trophy-big{font-size:55px;line-height:1}
@media(max-width:440px){.player-card{padding:15px}.player-profile h2{font-size:26px}.game-heading h1{font-size:31px}.player-summary{font-size:11px}.game-list-item button{font-size:11px!important;padding:6px 7px!important}}
</style></head><body><nav id="nav" aria-label="Navegação principal"></nav><div class="banner-wrap"><section class="supporter-banner" aria-label="Bancada de adeptos do Benfica"><div class="banner-text"><span class="banner-kicker">🔴⚪ GARRA · FOCO · FUTEBOL</span><strong>A TUA BANCADA.<br>A TUA MISSÃO.</strong></div></section></div><main id="root"></main><script>
const KEY='missao_tiago_v1',subjects=['Matemática','Português','Inglês','Francês','História','Geografia','Ciências Naturais','Físico-Química','Educação Física','Outra'],week=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const lessons={1:[['09:00–18:10','Aulas']],2:[['13:15–18:10','Aulas']],3:[['13:15–17:10','Aulas']],4:[['13:15–18:10','Aulas']],5:[['09:00–18:10','Aulas']]};
const sport={0:[['Manhã','Jogo de futebol']],1:[['19:15–20:30','Treino']],2:[['19:15–20:30','Treino']],5:[['18:00–19:15 / 20:30','Treinos (escalão e escalão acima)']]};
const proposed={2:'Matemática',3:'História / Geografia / Ciências',4:'Português / Físico-Química',6:'TPC pendentes / testes'};
const empty=()=>({tasks:[],tests:[],days:{},exceptions:[]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||empty()}catch{data=empty()}if(!Array.isArray(data.tasks)||!Array.isArray(data.tests)||!data.days)data=empty();if(!Array.isArray(data.exceptions))data.exceptions=[];
let tab='hoje',chosenDay=new Date().getDay(),chosenDate=dateKey(),focusTimer=null,secs=300;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateObj(s){return new Date(s+'T12:00:00')}
function distance(s){return Math.round((dateObj(s)-dateObj(dateKey()))/86400000)}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(s){return s?dateObj(s).toLocaleDateString('pt-PT',{day:'2-digit',month:'short'}):'Sem data'}
function noSchool(date){return data.exceptions.find(x=>x.from<=date&&x.to>=date)}
function chooseDate(v){if(/^\d{4}-\d{2}-\d{2}$/.test(v)){chosenDate=v;chosenDay=dateObj(v).getDay();render()}}
function chooseWeekDay(d){chosenDay=d;let base=dateObj(dateKey());base.setDate(base.getDate()+d-base.getDay());chosenDate=dateKey(base);render()}
function addException(event){event.preventDefault();let f=event.target,from=f.from.value,to=f.to.value,note=f.note.value.trim();if(!from||!to||from>to){alert('Confirma as datas.');return}data.exceptions.push({id:Date.now(),from,to,note});data.exceptions.sort((a,b)=>a.from.localeCompare(b.from));save();render()}
function deleteException(id){if(confirm('Eliminar este período sem aulas?')){data.exceptions=data.exceptions.filter(x=>x.id!==id);save();render()}}
function state(){return data.days[dateKey()]||(data.days[dateKey()]={checked:false,started:false,done:false})}
function openTasks(){return data.tasks.filter(x=>!x.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'))}
function testsSoon(){return data.tests.filter(x=>distance(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))}
function gameStats(){const starts=Object.keys(data.days).filter(k=>data.days[k]?.started).length;const completed=data.tasks.filter(t=>t.done).length;const points=starts*20+completed*10;return {starts,completed,points,level:1+Math.floor(points/120),toNext:points%120,progress:Math.round(points%120/120*100)}}
function dueLabel(date){if(!date)return 'Sem prazo';const n=distance(date);return n<0?'Atrasado '+Math.abs(n)+' dia(s)':n===0?'Entrega hoje':n===1?'Entrega amanhã':'Entrega '+fmt(date)}
function gameHeading(title,sub){return '<header class="game-heading"><div><span class="game-overline">🔴⚪ MISSÃO TIAGO / 9.º D</span><h1>'+title+'</h1><p>'+sub+'</p></div></header>'}
function nav(){const tabs=[["hoje","Arranque"],["agenda","Jornada"],["tpc","Missões"],["testes","Desafios"],["progresso","Conquistas"]];const icons={"hoje":"<circle cx=\"12\" cy=\"12\" r=\"9.5\"/><path d=\"m12 6 4.5 3.3-1.7 5.4H9.2L7.5 9.3 12 6ZM9.2 14.7 6 18m8.8-3.3 3.2 3.3M7.5 9.3 4 8m12.5 1.3L20 8\"/>","agenda":"<rect x=\"2\" y=\"5\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M12 5v14M2 12h20\"/><circle cx=\"12\" cy=\"12\" r=\"3.4\"/><path d=\"M2 9h3v6H2M22 9h-3v6h3\"/>","tpc":"<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><circle cx=\"8\" cy=\"8\" r=\"1.5\"/><circle cx=\"16\" cy=\"10\" r=\"1.5\"/><circle cx=\"9\" cy=\"17\" r=\"1.5\"/><path d=\"M9.5 9 14.5 10M15 11.5 10 16M8 9.5v5.5\"/>","testes":"<path d=\"M3 7h18v13H3zM3 7l3-4h12l3 4M9 7v5h6V7M9 20v-3h6v3\"/><circle cx=\"12\" cy=\"14\" r=\"1.5\"/>","progresso":"<path d=\"M8 3h8v5a4 4 0 0 1-8 0V3ZM8 5H4v2a4 4 0 0 0 4 4M16 5h4v2a4 4 0 0 1-4 4M12 12v5M8 21h8M9 17h6v4H9z\"/>"};document.getElementById('nav').innerHTML=tabs.map(([k,l])=>'<button type="button" class="'+(tab===k?'active':'')+'" aria-label="'+l+'" aria-current="'+(tab===k?'page':'false')+'" onclick="go(\''+k+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icons[k]+'</svg><span>'+l+'</span></button>').join('')}
function go(t){tab=t;render();scrollTo(0,0)}
function render(){nav();document.getElementById('root').innerHTML=({hoje:todayView,agenda:agendaView,tpc:tasksView,testes:testsView,progresso:progressView}[tab])()}
function check(k,v){state()[k]=v;save();render()}
function todayView(){let d=new Date().getDay(),rest=[0,1,5].includes(d),c=state(),task=openTasks()[0],test=testsSoon().find(x=>distance(x.date)<=7),stats=gameStats(),off=noSchool(dateKey()),mission=task?'TPC: '+task.title:test?'Preparar teste de '+test.subject:'Rever '+(proposed[d]||'matéria da semana'),progress=([c.checked,c.started].filter(Boolean).length/2*100);return gameHeading('Painel do jogador','Hoje jogamos com cabeça, sem pressas.')+'<section class="player-card"><div class="player-profile"><div class="player-avatar">T<span>09</span></div><div><span class="game-overline">JOGADOR · 9.º D</span><h2>TIAGO</h2><span class="player-rank">Nível '+stats.level+' · '+stats.points+' XP</span></div></div><div class="level-track"><span style="width:'+stats.progress+'%"></span></div><div class="player-summary"><span>⚽ '+stats.starts+' arranques</span><span>✓ '+stats.completed+' TPC feitos</span></div></section><section class="card hero game-hero"><span class="game-overline">'+week[d].toUpperCase()+' · '+new Date().toLocaleDateString('pt-PT')+'</span><h2>'+(rest?'Dia de recuperação ⚽':off?'Sem aulas. Aproveita a manhã!':'Missão do dia 🎯')+'</h2><p>'+(rest?'Descanso e futebol fazem parte do plano.':off?'As aulas estão suspensas hoje. Se houver tarefas urgentes, resolve apenas o essencial.':'Só precisas de começar por uma tarefa pequena. Uma de cada vez.')+'</p><span class="pill">'+(rest?'Descanso':d===6?'Sábado · até 25 min':'10:30 · 9–20 min')+'</span></section>'+(rest?'':'<section class="card"><div class="row"><h2>🎯 Objetivos de hoje</h2><span class="game-counter">'+[c.checked,c.started].filter(Boolean).length+'/2</span></div><div class="progress"><span style="width:'+progress+'%"></span></div><div class="mission-grid"><label class="mission-card '+(c.checked?'mission-done':'')+'"><input type="checkbox" '+(c.checked?'checked':'')+' onchange="check(\'checked\',this.checked)"><div class="mission-number">01</div><div class="grow"><b>Verificar missões</b><small>Classroom, Inovar e caderno</small></div></label><label class="mission-card '+(c.started?'mission-done':'')+'"><input type="checkbox" '+(c.started?'checked':'')+' onchange="check(\'started\',this.checked)"><div class="mission-number">02</div><div class="grow"><b>Entrar em campo</b><small>'+escapeHTML(mission)+'</small></div></label></div><p class="note">Não é uma corrida: cumprir o essencial é suficiente.</p></section>')+'<section class="card"><div class="row"><h2>📅 O programa de hoje</h2><button class="secondary tiny" onclick="go(\'agenda\')">Ver jornada</button></div>'+events(d,dateKey())+'</section><section class="card"><div class="row"><h2>⏳ Próximos desafios</h2><button class="secondary tiny" onclick="go(\'tpc\')">Ver missões</button></div>'+openTasks().slice(0,3).map(x=>'<div class="game-list-item"><div class="game-dot">✓</div><div class="grow"><b>'+escapeHTML(x.title)+'</b><small>'+escapeHTML(x.subject)+' · '+dueLabel(x.due)+'</small></div></div>').join('')+testsSoon().slice(0,2).map(x=>'<div class="game-list-item"><div class="game-dot">★</div><div class="grow"><b>Avaliação: '+escapeHTML(x.subject)+'</b><small>'+fmt(x.date)+'</small></div></div>').join('')+(!openTasks().length&&!testsSoon().length?'<div class="empty">Sem prazos registados. Confirma as plataformas!</div>':'')+'</section>'}
function events(d,date){let e=date&&noSchool(date),a=[...(e?[]:(lessons[d]||[])),...(sport[d]||[])];return (e?'<div class="offday"><strong>Sem aulas'+(e.note?' — '+escapeHTML(e.note):'')+'</strong><p class="note">Treinos e jogos mantêm-se.</p></div>':'')+(a.length?a.map(([h,n])=>'<div class="item"><b style="min-width:115px">'+h+'</b><span>'+n+'</span></div>').join(''):(e?'':'<p>Sem atividades registadas.</p>'))}
function agendaView(){return gameHeading('Calendário da jornada','Aulas, treinos, jogos e pausas — tudo no mesmo sítio.')+'<section class="card"><div class="row"><h2>📍 Escolher dia</h2><span class="pill">Época 2026/27</span></div><label for="agendaDate">Data</label><input id="agendaDate" type="date" value="'+chosenDate+'" onchange="chooseDate(this.value)"><div class="days">'+week.map((n,i)=>'<button class="'+(chosenDay===i?'active':'')+'" onclick="chooseWeekDay('+i+')">'+n.slice(0,3)+'</button>').join('')+'</div><h3 class="match-day">'+week[chosenDay]+' · '+fmt(chosenDate)+'</h3>'+events(chosenDay,chosenDate)+(proposed[chosenDay]?'<div class="game-tip"><b>🎯 Missão sugerida</b><p>'+(chosenDay===6?'11:00 · até 25 minutos':'10:30 · 9–20 minutos')+' · '+proposed[chosenDay]+'</p></div>':'')+'</section><details class="card game-details"><summary>⚙️ Gerir dias sem aulas</summary><p class="note">Marca férias, greves ou outros períodos. O horário normal não é alterado.</p><form onsubmit="addException(event)"><label>De</label><input name="from" type="date" required value="'+dateKey()+'"><label>Até (inclusive)</label><input name="to" type="date" required value="'+dateKey()+'"><label>Motivo (opcional)</label><input name="note" maxlength="80" placeholder="Ex.: interrupção letiva"><button type="submit">+ Guardar período</button></form><p class="note">Treinos e jogos mantêm-se.</p><div class="line"></div><h3>Períodos guardados</h3>'+(data.exceptions.length?data.exceptions.map(x=>'<div class="game-list-item"><div class="grow"><b>'+fmt(x.from)+(x.to!==x.from?' a '+fmt(x.to):'')+'</b><small>'+(x.note?escapeHTML(x.note):'Sem aulas')+'</small></div><button class="danger tiny" onclick="deleteException('+x.id+')">Eliminar</button></div>').join(''):'<p class="muted">Sem períodos registados.</p>')+'</details><p class="note">À sexta, o Tiago sai da escola para parte do primeiro treino e segue para o escalão acima.</p>'}
function subjectSelect(){return subjects.map(x=>'<option>'+x+'</option>').join('')}
function tasksView(){const list=data.tasks.slice().sort((a,b)=>(a.done-b.done)||(a.due||'9999').localeCompare(b.due||'9999'));return gameHeading('Missões','TPC e trabalhos, organizados sem complicações.')+'<section class="card"><div class="row"><h2>📋 Quadro de missões</h2><span class="game-counter">'+openTasks().length+' por fazer</span></div>'+(list.length?list.map(x=>'<div class="game-list-item '+(x.done?'completed':'')+'"><input type="checkbox" aria-label="Concluir missão" '+(x.done?'checked':'')+' onchange="taskDone('+x.id+',this.checked)"><div class="grow"><b>'+escapeHTML(x.title)+'</b><small>'+escapeHTML(x.subject)+' · '+dueLabel(x.due)+'</small></div><button class="secondary tiny" onclick="editTask('+x.id+')">Editar</button><button class="danger tiny" onclick="removeTask('+x.id+')">×</button></div>').join(''):'<div class="empty">Sem missões registadas. Consulta Classroom, Inovar e caderno.</div>')+'</section><details class="card game-details"><summary>➕ Adicionar missão</summary><form onsubmit="addTask(event)"><label>Disciplina</label><select name="subject">'+subjectSelect()+'</select><label>Qual é a missão?</label><input name="title" required maxlength="150" placeholder="Ex.: exercícios 1 a 4, pág. 32"><label>Data-limite (opcional)</label><input name="due" type="date"><button>Guardar missão</button></form></details>'}
function addTask(e){e.preventDefault();let f=e.target;data.tasks.push({id:Date.now(),subject:f.subject.value,title:f.title.value.trim(),due:f.due.value,done:false});save();render()}
function taskDone(id,v){let t=data.tasks.find(x=>x.id===id);if(t)t.done=v;save();render()}
function removeTask(id){if(confirm('Eliminar este TPC?')){data.tasks=data.tasks.filter(x=>x.id!==id);save();render()}}
function editTask(id){let t=data.tasks.find(x=>x.id===id);if(!t)return;let value=prompt('Descrição do TPC',t.title);if(value===null||!value.trim())return;t.title=value.trim();let due=prompt('Prazo (AAAA-MM-DD), ou vazio',t.due||'');if(due!==null&&(!due||/^\d{4}-\d{2}-\d{2}$/.test(due)))t.due=due;save();render()}
function testsView(){const list=data.tests.slice().sort((a,b)=>a.date.localeCompare(b.date));return gameHeading('Grandes desafios','Prepara os testes com antecedência, sem estudar tudo na véspera.')+'<section class="card"><div class="row"><h2>🏆 Próximas avaliações</h2><span class="game-counter">'+testsSoon().length+' por vir</span></div>'+(list.length?list.map(x=>'<div class="game-list-item"><div class="game-dot">★</div><div class="grow"><b>'+escapeHTML(x.subject)+'</b><small>'+fmt(x.date)+(x.notes?' · '+escapeHTML(x.notes):'')+'</small></div>'+(distance(x.date)>=0&&distance(x.date)<=3?'<span class="tag">Em breve</span>':'')+'<button class="secondary tiny" onclick="editTest('+x.id+')">Editar</button><button class="danger tiny" onclick="removeTest('+x.id+')">×</button></div>').join(''):'<div class="empty">Não há avaliações registadas.</div>')+'</section><details class="card game-details"><summary>➕ Adicionar avaliação</summary><form onsubmit="addTest(event)"><label>Disciplina</label><select name="subject">'+subjectSelect()+'</select><label>Data do teste</label><input type="date" required name="date"><label>Matéria (opcional)</label><textarea name="notes" maxlength="400" rows="2" placeholder="Ex.: páginas 25–40"></textarea><button>Guardar avaliação</button></form></details>'}
function addTest(e){e.preventDefault();let f=e.target;data.tests.push({id:Date.now(),subject:f.subject.value,date:f.date.value,notes:f.notes.value.trim()});save();render()}
function editTest(id){let t=data.tests.find(x=>x.id===id);if(!t)return;let d=prompt('Data (AAAA-MM-DD)',t.date);if(d===null||!/^\d{4}-\d{2}-\d{2}$/.test(d))return;let n=prompt('Matéria / notas',t.notes);t.date=d;if(n!==null)t.notes=n;save();render()}
function removeTest(id){if(confirm('Eliminar este teste?')){data.tests=data.tests.filter(x=>x.id!==id);save();render()}}
function progressView(){let now=new Date(),monday=new Date(now);monday.setDate(now.getDate()-(now.getDay()+6)%7);let keys=Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(monday.getDate()+i);return dateKey(d)}),eligible=keys.filter(k=>[2,3,4,6].includes(dateObj(k).getDay())&&distance(k)<=0),started=eligible.filter(k=>data.days[k]?.started).length,stats=gameStats();return gameHeading('Sala de troféus','Evolução real: começar, tentar e ganhar autonomia.')+'<section class="player-card"><span class="game-overline">PERFIL DO JOGADOR</span><div class="row"><div><h2>NÍVEL '+stats.level+'</h2><p>'+stats.points+' XP de progresso</p></div><div class="trophy-big">🏆</div></div><div class="level-track"><span style="width:'+stats.progress+'%"></span></div><p class="note">'+stats.toNext+'/120 XP no nível atual. Pontos só representam registos, não notas escolares.</p></section><div class="grid"><div class="metric"><strong>'+started+'/'+eligible.length+'</strong><small>Arranques desta semana</small></div><div class="metric"><strong>'+stats.completed+'</strong><small>TPC concluídos</small></div></div><section class="card"><h2>⚽ Resumo da semana</h2>'+keys.map(k=>{let d=dateObj(k).getDay(),c=data.days[k]||{},rest=[0,1,5].includes(d);return '<div class="item"><b style="width:52px">'+week[d].slice(0,3)+'</b><div class="progress grow"><span style="width:'+(c.started?100:c.checked?50:0)+'%"></span></div><b>'+(rest?'⚽':c.started?'✓':c.checked?'●':'—')+'</b></div>'}).join('')+'<p class="note">✓ missão iniciada · ● tarefas verificadas · ⚽ dia de descanso</p></section><details class="card game-details"><summary>⚙️ Dados e cópias de segurança</summary><p>Os registos ficam guardados apenas neste dispositivo e navegador. Não há sincronização entre telemóveis.</p><div class="actions"><button onclick="exportData()">↓ Exportar dados</button><button class="secondary" onclick="document.getElementById(\'importfile\').click()">↑ Importar dados</button></div><input id="importfile" type="file" accept="application/json,.json" class="hidden" onchange="importData(event)"><div class="line"></div><button class="danger" onclick="resetData()">Apagar os meus dados</button></details>'}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='missao-tiago-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.tasks)||!Array.isArray(obj.tests)||!obj.days)throw Error();if(!Array.isArray(obj.exceptions))obj.exceptions=[];if(confirm('Substituir todos os dados atuais pela cópia?')){data=obj;save();render()}}catch{alert('Ficheiro de cópia inválido.')}}
function resetData(){if(confirm('Tens a certeza? Todos os TPC, testes e progresso serão apagados.')){data=empty();save();render()}}
function startFocus(){if(focusTimer)clearInterval(focusTimer);secs=300;let clock=document.getElementById('clock');if(clock)clock.textContent='05:00';focusTimer=setInterval(()=>{secs--;let el=document.getElementById('clock');if(el)el.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');if(secs<=0){clearInterval(focusTimer);focusTimer=null;alert('Boa! Já começaste. Queres continuar mais um pouco?')}},1000)}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>

<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b30"><title>Missão Tiago</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#edf5ff;background:#0b1220}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:20px 16px 95px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:27px;margin:6px 0 8px}h2{font-size:18px;margin:0 0 13px}h3{font-size:15px;margin:10px 0}p{line-height:1.5;color:#acbed3}small,.muted{color:#9fb1c8}.pill{border-radius:30px;padding:6px 10px;background:#173b42;color:#84ebcd;font-size:12px;font-weight:700}.card{background:#15223a;border:1px solid #29405f;border-radius:18px;padding:18px;margin:14px 0}.hero{background:linear-gradient(140deg,#164052,#172540)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#1b2d49;border-radius:14px;padding:14px}.metric strong{display:block;font-size:27px;color:#7be0c3}button,.btn{background:#67dfba;color:#091b24;border:0;border-radius:11px;padding:12px 14px;font:inherit;font-weight:750;cursor:pointer}button.secondary{background:#2a3d5b;color:#eaf4ff}button.danger{background:#5c2835;color:#ffccd3}button.tiny{padding:6px 10px;font-size:13px}input,select,textarea{display:block;width:100%;padding:12px;background:#0b1629;border:1px solid #405573;border-radius:10px;color:#fff;font:inherit;margin:6px 0 12px}label{display:block;font-size:13px;font-weight:700;color:#bacee2}input[type=checkbox]{display:inline-block;width:20px;height:20px;margin:0;accent-color:#61dbb6}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:4px;padding:8px 6px max(8px,env(safe-area-inset-bottom));background:#101e32;border-top:1px solid #304763;z-index:2}nav button{padding:9px 4px;background:transparent;color:#9cb2c9;font-size:11px;min-width:0;flex:1}nav button.active{background:#214e50;color:#baffeb}.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #2c405d}.item:last-child{border-bottom:0}.item .grow{flex:1;min-width:0}.item b{display:block;overflow-wrap:anywhere}.item small{display:block;margin-top:3px}.tag{font-size:11px;padding:4px 7px;background:#3d2c37;color:#ffb9ad;border-radius:8px}.days{display:flex;gap:5px;overflow:auto}.days button{flex:1;min-width:42px;padding:10px 4px;background:#263851;color:white}.days button.active{background:#68dfbb;color:#092028}.line{height:1px;background:#304663;margin:16px 0}.empty{padding:16px;text-align:center;color:#a9b9cc;background:#122035;border-radius:12px}.check{display:flex;gap:12px;align-items:flex-start;margin:16px 0}.check label{flex:1;font-size:15px;color:#edf5ff;font-weight:500}.progress{height:9px;background:#2d3b50;border-radius:20px;overflow:hidden}.progress>span{display:block;height:100%;background:#5cdbb3}.actions{display:flex;gap:8px;flex-wrap:wrap}.note{font-size:12px}.hidden{display:none}.time{font-variant-numeric:tabular-nums;font-weight:800;font-size:38px;text-align:center;margin:12px}.sectiontitle{margin:20px 0 6px;font-size:12px;letter-spacing:.12em;color:#8fdccf;text-transform:uppercase}
</style></head><body><main id="root"></main><nav id="nav"></nav><script>
const KEY='missao_tiago_v1',subjects=['Matemática','Português','Inglês','Francês','História','Geografia','Ciências Naturais','Físico-Química','Educação Física','Outra'],week=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const lessons={1:[['09:00–18:10','Aulas']],2:[['13:15–18:10','Aulas']],3:[['13:15–17:10','Aulas']],4:[['13:15–18:10','Aulas']],5:[['09:00–18:10','Aulas']]};
const sport={0:[['Manhã','Jogo de futebol']],1:[['19:15–20:30','Treino']],2:[['19:15–20:30','Treino']],5:[['18:00–19:15 / 20:30','Treinos (escalão e escalão acima)']]};
const proposed={2:'Matemática',3:'História / Geografia / Ciências',4:'Português / Físico-Química',6:'TPC pendentes / testes'};
const empty=()=>({tasks:[],tests:[],days:{}});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||empty()}catch{data=empty()}if(!Array.isArray(data.tasks)||!Array.isArray(data.tests)||!data.days)data=empty();
let tab='hoje',chosenDay=new Date().getDay(),focusTimer=null,secs=300;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateObj(s){return new Date(s+'T12:00:00')}
function distance(s){return Math.round((dateObj(s)-dateObj(dateKey()))/86400000)}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(s){return s?dateObj(s).toLocaleDateString('pt-PT',{day:'2-digit',month:'short'}):'Sem data'}
function state(){return data.days[dateKey()]||(data.days[dateKey()]={checked:false,started:false,done:false})}
function openTasks(){return data.tasks.filter(x=>!x.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'))}
function testsSoon(){return data.tests.filter(x=>distance(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))}
function nav(){document.getElementById('nav').innerHTML=[['hoje','🏠 Hoje'],['agenda','📅 Agenda'],['tpc','✅ TPC'],['testes','📝 Testes'],['progresso','📈 Progresso']].map(([k,l])=>'<button class="'+(tab===k?'active':'')+'" onclick="go(\''+k+'\')">'+l+'</button>').join('')}
function go(t){tab=t;render();scrollTo(0,0)}
function render(){nav();document.getElementById('root').innerHTML=({hoje:todayView,agenda:agendaView,tpc:tasksView,testes:testsView,progresso:progressView}[tab])()}
function check(k,v){state()[k]=v;save();render()}
function todayView(){let d=new Date().getDay(),rest=[0,1,5].includes(d),c=state(),task=openTasks()[0],test=testsSoon().find(x=>distance(x.date)<=7),mission=task?'TPC: '+task.title:test?'Preparar teste de '+test.subject:'Rever '+(proposed[d]||'matéria da semana');return '<header><b>⚡ MISSÃO TIAGO</b><span class="pill">9.º ano · 14 anos</span></header><div class="card hero"><small>'+week[d]+' · '+new Date().toLocaleDateString('pt-PT')+'</small><h1>'+(rest?'Hoje é para recuperar ⚽':'Uma missão. Sem complicar. 🚀')+'</h1><p>'+(rest?'Sem estudo obrigatório neste dia. Recuperar também conta.':'Começa com 5 minutos. Não precisas de fazer tudo de uma vez.')+'</p><span class="pill">'+(rest?'Descanso':d===6?'Sábado · 11:00':'10:30 · 9–20 minutos')+'</span></div><div class="card"><h2>Hoje na agenda</h2>'+events(d)+'</div>'+(rest?'': '<div class="card"><h2>As 3 missões</h2><div class="check"><input type="checkbox" '+(c.checked?'checked':'')+' onchange="check(\'checked\',this.checked)"><label>Ver Classroom, Inovar e caderno (2 min)</label></div><div class="check"><input type="checkbox" '+(c.started?'checked':'')+' onchange="check(\'started\',this.checked)"><label>Começar: '+escapeHTML(mission)+' (5 min)</label></div><div class="check"><input type="checkbox" '+(c.done?'checked':'')+' onchange="check(\'done\',this.checked)"><label>Concluir ou registar o que falta</label></div><div class="progress"><span style="width:'+([c.checked,c.started,c.done].filter(Boolean).length/3*100)+'%"></span></div><div class="line"></div><div class="row"><strong>Temporizador de arranque</strong><button class="secondary tiny" onclick="startFocus()">▶ 5 min</button></div><div class="time" id="clock">05:00</div><p class="note">Se houver TPC com prazo próximo, têm prioridade. Se precisares de ajuda a começar, pede só os primeiros 2 minutos.</p></div>')+'<div class="card"><h2>Próximos prazos</h2>'+openTasks().slice(0,3).map(x=>'<div class="item"><div class="grow"><b>'+escapeHTML(x.title)+'</b><small>'+escapeHTML(x.subject)+' · '+fmt(x.due)+'</small></div></div>').join('')+(testsSoon().slice(0,2).map(x=>'<div class="item"><div class="grow"><b>Teste: '+escapeHTML(x.subject)+'</b><small>'+fmt(x.date)+'</small></div></div>').join(''))+(!openTasks().length&&!testsSoon().length?'<div class="empty">Sem prazos registados. Confirma as plataformas!</div>':'')+'</div>'}
function events(d){let a=[...(lessons[d]||[]),...(sport[d]||[])];return a.length?a.map(([h,n])=>'<div class="item"><b style="min-width:115px">'+h+'</b><span>'+n+'</span></div>').join(''):'<p>Sem atividades registadas.</p>'}
function agendaView(){return '<header><h1>Agenda semanal</h1></header><div class="days">'+week.map((n,i)=>'<button class="'+(chosenDay===i?'active':'')+'" onclick="chosenDay='+i+';render()">'+n.slice(0,3)+'</button>').join('')+'</div><div class="card"><h2>'+week[chosenDay]+'</h2>'+events(chosenDay)+(proposed[chosenDay]?'<div class="line"></div><h3>📚 Missão recomendada</h3><p>'+(chosenDay===6?'11:00 · até 25 minutos':'10:30 · 9–20 minutos')+' · '+proposed[chosenDay]+'</p><small>Os TPC urgentes e os testes próximos têm prioridade.</small>':'')+'</div><p class="note">À sexta, o treino começa às 18:00, mesmo quando o horário de aulas indica 18:10; o Tiago sai da escola e apanha parte do primeiro treino, seguindo para o escalão acima.</p>'}
function subjectSelect(){return subjects.map(x=>'<option>'+x+'</option>').join('')}
function tasksView(){return '<header><h1>TPC e trabalhos</h1></header><p>Regista o que tens de fazer assim que souberes. Confirma também Inovar, Classroom e caderno.</p><div class="card"><h2>Adicionar TPC</h2><form onsubmit="addTask(event)"><label>Disciplina</label><select name="subject">'+subjectSelect()+'</select><label>O que é para fazer?</label><input name="title" required maxlength="150" placeholder="Ex.: exercícios 1 a 4, pág. 32"><label>Entrega (opcional)</label><input name="due" type="date"><button>+ Guardar TPC</button></form></div><div class="card"><h2>Pendentes ('+openTasks().length+')</h2>'+data.tasks.slice().sort((a,b)=>(a.done-b.done)||(a.due||'9999').localeCompare(b.due||'9999')).map(x=>'<div class="item"><input type="checkbox" '+(x.done?'checked':'')+' onchange="taskDone('+x.id+',this.checked)"><div class="grow"><b style="'+(x.done?'text-decoration:line-through;opacity:.6':'')+'">'+escapeHTML(x.title)+'</b><small>'+escapeHTML(x.subject)+' · '+fmt(x.due)+'</small></div><button class="secondary tiny" onclick="editTask('+x.id+')">Editar</button><button class="danger tiny" onclick="removeTask('+x.id+')">×</button></div>').join('')+(!data.tasks.length?'<div class="empty">Ainda não adicionaste TPC.</div>':'')+'</div>'}
function addTask(e){e.preventDefault();let f=e.target;data.tasks.push({id:Date.now(),subject:f.subject.value,title:f.title.value.trim(),due:f.due.value,done:false});save();render()}
function taskDone(id,v){let t=data.tasks.find(x=>x.id===id);if(t)t.done=v;save();render()}
function removeTask(id){if(confirm('Eliminar este TPC?')){data.tasks=data.tasks.filter(x=>x.id!==id);save();render()}}
function editTask(id){let t=data.tasks.find(x=>x.id===id);if(!t)return;let value=prompt('Descrição do TPC',t.title);if(value===null||!value.trim())return;t.title=value.trim();let due=prompt('Prazo (AAAA-MM-DD), ou vazio',t.due||'');if(due!==null&&(!due||/^\d{4}-\d{2}-\d{2}$/.test(due)))t.due=due;save();render()}
function testsView(){return '<header><h1>Testes</h1></header><p>Adiciona os testes com antecedência para aparecerem nas missões diárias.</p><div class="card"><h2>Novo teste</h2><form onsubmit="addTest(event)"><label>Disciplina</label><select name="subject">'+subjectSelect()+'</select><label>Data do teste</label><input type="date" required name="date"><label>Matéria (opcional)</label><textarea name="notes" maxlength="400" rows="2" placeholder="Ex.: páginas 25–40"></textarea><button>+ Guardar teste</button></form></div><div class="card"><h2>Calendário</h2>'+data.tests.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>'<div class="item"><div class="grow"><b>'+escapeHTML(x.subject)+'</b><small>'+fmt(x.date)+' · '+escapeHTML(x.notes)+'</small></div>'+(distance(x.date)>=0&&distance(x.date)<=3?'<span class="tag">Próximo</span>':'')+'<button class="secondary tiny" onclick="editTest('+x.id+')">Editar</button><button class="danger tiny" onclick="removeTest('+x.id+')">×</button></div>').join('')+(!data.tests.length?'<div class="empty">Ainda não há testes registados.</div>':'')+'</div>'}
function addTest(e){e.preventDefault();let f=e.target;data.tests.push({id:Date.now(),subject:f.subject.value,date:f.date.value,notes:f.notes.value.trim()});save();render()}
function editTest(id){let t=data.tests.find(x=>x.id===id);if(!t)return;let d=prompt('Data (AAAA-MM-DD)',t.date);if(d===null||!/^\d{4}-\d{2}-\d{2}$/.test(d))return;let n=prompt('Matéria / notas',t.notes);t.date=d;if(n!==null)t.notes=n;save();render()}
function removeTest(id){if(confirm('Eliminar este teste?')){data.tests=data.tests.filter(x=>x.id!==id);save();render()}}
function progressView(){let now=new Date(),monday=new Date(now);monday.setDate(now.getDate()-(now.getDay()+6)%7);let keys=Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(monday.getDate()+i);return dateKey(d)}),eligible=keys.filter(k=>[2,3,4,6].includes(dateObj(k).getDay())&&distance(k)<=0),started=eligible.filter(k=>data.days[k]?.started).length,done=data.tasks.filter(x=>x.done).length;return '<header><h1>Progresso</h1></header><p>O objetivo é começar, não acumular horas. Cada pequeno arranque conta.</p><div class="grid"><div class="metric"><strong>'+started+'/'+eligible.length+'</strong><small>Arranques esta semana</small></div><div class="metric"><strong>'+done+'/'+data.tasks.length+'</strong><small>TPC concluídos</small></div></div><div class="card"><h2>Esta semana</h2>'+keys.map(k=>{let d=dateObj(k).getDay(),c=data.days[k]||{},rest=[0,1,5].includes(d);return '<div class="item"><b style="width:52px">'+week[d].slice(0,3)+'</b><div class="progress grow"><span style="width:'+(c.done?100:c.started?66:c.checked?33:0)+'%"></span></div><b>'+(rest?'⚽':c.done?'✓':c.started?'●':'—')+'</b></div>'}).join('')+'</div><div class="card"><h2>Cópias de segurança</h2><p>Os dados ficam apenas neste navegador, neste telemóvel. Não são sincronizados entre dispositivos. Guarda uma cópia regularmente.</p><div class="actions"><button onclick="exportData()">↓ Exportar dados</button><button class="secondary" onclick="document.getElementById(\'importfile\').click()">↑ Importar dados</button></div><input id="importfile" type="file" accept="application/json,.json" class="hidden" onchange="importData(event)"><div class="line"></div><button class="danger" onclick="resetData()">Apagar os meus dados</button></div>'}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='missao-tiago-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.tasks)||!Array.isArray(obj.tests)||!obj.days)throw Error();if(confirm('Substituir todos os dados atuais pela cópia?')){data=obj;save();render()}}catch{alert('Ficheiro de cópia inválido.')}}
function resetData(){if(confirm('Tens a certeza? Todos os TPC, testes e progresso serão apagados.')){data=empty();save();render()}}
function startFocus(){if(focusTimer)clearInterval(focusTimer);secs=300;let clock=document.getElementById('clock');if(clock)clock.textContent='05:00';focusTimer=setInterval(()=>{secs--;let el=document.getElementById('clock');if(el)el.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');if(secs<=0){clearInterval(focusTimer);focusTimer=null;alert('Boa! Já começaste. Queres continuar mais um pouco?')}},1000)}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
